services:
  portfolio-tui:
    build:
      context: .
    image: portfolio-tui
    container_name: portfolio-tui
    user: "${UID:-1000}:${GID:-1000}"
    restart: unless-stopped
    command: serve
    env_file:
      - .env
    ports:
      - "${PORTFOLIO_BIND_IP:-0.0.0.0}:${PORTFOLIO_SSH_PORT:-23234}:${PORTFOLIO_SSH_PORT:-23234}"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.ssh:/app/.ssh
      - ./logs:/app/logs
